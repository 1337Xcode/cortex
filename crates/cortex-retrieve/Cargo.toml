[package]
name = "cortex-retrieve"
description = "Cortex retrieval: seeds from a prompt and a session, spreading activation over the learned graph, the gate, and the work order and primer it renders."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Turns on the heap profiler and the example that uses it. Nothing in the product reads it, and no
# build of the product sets it.
[features]
profiling = ["dep:dhat"]

[dependencies]
cortex-coord = { path = "../cortex-coord" }
cortex-core = { path = "../cortex-core" }
cortex-index = { path = "../cortex-index" }
cortex-learn = { path = "../cortex-learn" }
cortex-meter = { path = "../cortex-meter" }
cortex-store = { path = "../cortex-store" }
dhat = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
petgraph.workspace = true
proptest.workspace = true
rusqlite.workspace = true
tempfile.workspace = true

[[bench]]
name = "experience"
harness = false

[[bench]]
name = "spread"
harness = false

[[example]]
name = "graph_heap"
required-features = ["profiling"]

[lints]
workspace = true
