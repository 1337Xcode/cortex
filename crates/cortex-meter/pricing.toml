# What Cortex estimates model responses cost with, in US dollars per million tokens.
#
# Cortex shipped these prices as Anthropic's pricing page listed them on the date below. Change any
# of them to what you pay and Cortex estimates with yours; add a model the same way. A response
# whose model, speed, service tier or region has no price here, or whose cache writes the
# transcript does not split between the two lifetimes, gets no estimate rather than a guess. Cache prices: `cache_write_5m` for input written to the five-minute cache,
# `cache_write_1h` for the one-hour cache, `cache_read` for input read from the cache.
#
# A model's `standard` prices are those of the standard speed. `fast` holds its fast mode prices,
# where it has a fast mode. `us_only` multiplies every price of a response kept to inference in
# the United States, where the model offers it. `long_prompt` holds the prices of a request whose
# prompt (its input, cache writes and cache reads together) is over `long_prompt_above_tokens`.
# A dated model id such as `claude-haiku-4-5-20251001` takes the prices of `claude-haiku-4-5`.

