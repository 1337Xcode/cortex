[package]
name = "cortex-daemon"
description = "The Cortex daemon: one process per repository that keeps its index and is its only writer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
cortex-core = { path = "../cortex-core" }
cortex-git = { path = "../cortex-git" }
cortex-index = { path = "../cortex-index" }
cortex-coord = { path = "../cortex-coord" }
cortex-learn = { path = "../cortex-learn" }
cortex-meter = { path = "../cortex-meter" }
cortex-retrieve = { path = "../cortex-retrieve" }
cortex-store = { path = "../cortex-store" }
getrandom.workspace = true
interprocess = { workspace = true, features = ["tokio"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
widestring.workspace = true

[dev-dependencies]
criterion.workspace = true
# Writes a value the store's own writer never would, for a test of a step that fails.
rusqlite.workspace = true
tempfile.workspace = true
# A paused clock, so that a test of the 10 s frame timeout takes no time.
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "upkeep"
harness = false

[lints]
workspace = true
