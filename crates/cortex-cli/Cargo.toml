[package]
name = "cortex-cli"
description = "The cortex binary: every user command and the internal entry points agents call."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "cortex"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
cortex-core = { path = "../cortex-core" }
cortex-daemon = { path = "../cortex-daemon" }
cortex-hook = { path = "../cortex-hook" }
cortex-index = { path = "../cortex-index" }
cortex-store = { path = "../cortex-store" }
serde.workspace = true
# The order of a settings file's keys is the user's, and a merge keeps it.
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
criterion.workspace = true
interprocess.workspace = true
tempfile.workspace = true

[[bench]]
name = "hooks"
harness = false

[lints]
workspace = true
