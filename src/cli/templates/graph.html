<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cortex Graph</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0f0f14;
  --panel: rgba(20,20,28,0.95);
  --border: rgba(255,255,255,0.08);
  --accent: #a8b1ff;
  --text-dim: #6b7280;
  --top-bar-height: 60px;
}
body { overflow: hidden; background: var(--bg); font-family: 'IBM Plex Sans', sans-serif; color: #e2e4e9; }
::-webkit-scrollbar { width: 0; height: 0; }

#graph { width: 100vw; height: 100vh; }

/* Top bar */
#top-bar {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 100;
  width: min(980px, calc(100% - 28px)); min-height: 56px;
  background: rgba(15,15,20,0.9); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
  display: grid; grid-template-columns: minmax(120px, 1fr) minmax(240px, 1.4fr) auto;
  align-items: center; gap: 12px; padding: 8px 12px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
}
.icon-12 { width: 12px; height: 12px; }
.icon-14 { width: 14px; height: 14px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-name {
  font-size: 13px; font-weight: 400; color: var(--accent);
  font-family: 'Press Start 2P', ui-monospace, monospace;
  letter-spacing: 0.4px;
}
.brand-tag {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
  color: #f3f5ff; background: #2a315a; border: 1px solid #3b4375;
  border-radius: 999px; padding: 2px 8px;
}
.stats { font-size: 12px; color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; white-space: nowrap; }

.search-wrap {
  display: flex; align-items: center; gap: 8px; width: 100%;
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px;
}
.search-wrap:focus-within { border-color: rgba(168,177,255,0.4); box-shadow: 0 0 0 2px rgba(168,177,255,0.1); }
.search-wrap input {
  width: 100%; padding: 6px 2px; border: none; outline: none; background: transparent;
  color: #e2e4e9; font-size: 13px; font-family: 'IBM Plex Mono', monospace;
}
.search-wrap input::placeholder { color: #4b5563; }
.search-wrap .icon-14 { color: #7b8291; }

.nav { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
.nav a, .nav button {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 8px; font-size: 12px; color: #c3cad8;
  text-decoration: none; background: transparent; border: 1px solid transparent;
  transition: color 0.15s, border-color 0.15s; cursor: pointer; font-family: 'IBM Plex Sans', sans-serif;
}
.nav a:hover, .nav button:hover { color: #e2e4e9; border-color: rgba(168,177,255,0.25); }
.nav a.active {
  color: var(--accent); background: rgba(168,177,255,0.12); border-color: rgba(168,177,255,0.25);
}
.nav .ghost { background: transparent; }
.nav a::after, .nav button::after {
  content: attr(data-label);
  position: absolute; left: 50%; top: 40px; transform: translate(-50%, -4px);
  background: rgba(15,15,20,0.96); border: 1px solid rgba(255,255,255,0.08);
  color: #e2e4e9; padding: 4px 8px; border-radius: 6px;
  font-size: 11px; white-space: nowrap; opacity: 0; pointer-events: none;
  transition: opacity 0.12s ease, transform 0.12s ease;
}
.nav a:hover::after, .nav button:hover::after { opacity: 1; transform: translate(-50%, 0); }

/* Node detail panel */
#panel {
  position: fixed; top: calc(var(--top-bar-height) + 12px); right: 16px; width: 320px; z-index: 90;
  background: rgba(15,15,20,0.95); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.06); border-radius: 12px;
  padding: 20px; display: none; max-height: calc(100vh - 90px); overflow-y: auto;
}
#panel.visible { display: block; }
#panel h2 { font-size: 14px; font-weight: 600; color: #a8b1ff; margin-bottom: 12px; word-break: break-all; }
#panel .field { margin-bottom: 10px; }
#panel .field-label { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
#panel .field-value { font-size: 13px; font-family: 'IBM Plex Mono', monospace; color: #d1d5db; }
#panel .connections { margin-top: 16px; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 12px; }
#panel .conn-item { font-size: 12px; padding: 4px 0; color: #9ca3af; cursor: pointer; transition: color 0.15s; }
#panel .conn-item:hover { color: #a8b1ff; }
#panel .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
#panel .badge-function { background: rgba(88,166,255,0.15); color: #58a6ff; }
#panel .badge-class { background: rgba(214,168,255,0.15); color: #d2a8ff; }
#panel .badge-route { background: rgba(126,231,135,0.15); color: #7ee787; }
#panel .badge-module { background: rgba(255,166,87,0.15); color: #ffa657; }
#panel .badge-method { background: rgba(88,166,255,0.15); color: #58a6ff; }
#panel .badge-interface { background: rgba(137,220,235,0.15); color: #89dceb; }
#panel .badge-type { background: rgba(245,194,231,0.15); color: #f5c2e7; }

/* Legend */
#legend {
  position: fixed; bottom: 16px; left: 16px; z-index: 90;
  background: rgba(15,15,20,0.9); border: 1px solid rgba(255,255,255,0.06);
  border-radius: 8px; padding: 12px 16px; font-size: 11px;
}
#legend .item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
#legend .dot { width: 8px; height: 8px; border-radius: 50%; }
#legend .dot.high { background: #7c8aff; }
#legend .dot.med { background: #f78166; }
#legend .dot.low { background: #7ee787; }
#legend .note { margin-top: 8px; color: #6b7280; }

/* Controls hint */
#controls {
  position: fixed; bottom: 16px; right: 16px; z-index: 90;
  font-size: 11px; color: #4b5563; text-align: right;
}

@media (max-width: 720px) {
  #top-bar {
    grid-template-columns: 1fr; gap: 8px; padding: 10px 12px;
  }
  .brand, .nav { justify-content: center; }
  .nav a::after, .nav button::after { left: 50%; transform: translate(-50%, -4px); }
  .nav a:hover::after, .nav button:hover::after { transform: translate(-50%, 0); }
}

/* Loading */
.loading {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  color: #6b7280; font-size: 14px; z-index: 200;
}
.loading::after {
  content: ''; display: inline-block; width: 12px; height: 12px;
  border: 2px solid #6b7280; border-top-color: transparent; border-radius: 50%;
  animation: spin 0.8s linear infinite; margin-left: 8px; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading" class="loading">Loading graph</div>

<div id="top-bar">
  <div class="brand">
    <span class="brand-name">Cortex</span>
    <span class="brand-tag">Graph</span>
    <span class="stats" id="stats-text"></span>
  </div>
  <label class="search-wrap" aria-label="Search symbols">
    <i data-lucide="search" class="icon-14"></i>
    <input id="search" type="text" placeholder="Search symbols..." autocomplete="off" spellcheck="false">
  </label>
  <div class="nav">
    <button class="ghost" type="button" data-label="Hotspots" aria-label="Hotspots" onclick="showTopNodes()"><i data-lucide="flame" class="icon-12"></i></button>
    <button class="ghost" type="button" data-label="Reset" aria-label="Reset" onclick="document.getElementById('panel').classList.remove('visible');highlightNodes.clear();highlightLinks.clear();Graph.nodeColor(Graph.nodeColor());Graph.linkColor(Graph.linkColor());"><i data-lucide="rotate-ccw" class="icon-12"></i></button>
    <a class="active" href="/" data-label="Graph" aria-label="Graph"><i data-lucide="git-branch" class="icon-12"></i></a>
    <a href="/dashboard" data-label="Dashboard" aria-label="Dashboard"><i data-lucide="layout-dashboard" class="icon-12"></i></a>
  </div>
</div>

<div id="panel">
  <h2 id="panel-name" aria-live="polite">Node</h2>
  <div class="field"><div class="field-label">Kind</div><div class="field-value" id="panel-kind"></div></div>
  <div class="field"><div class="field-label">File</div><div class="field-value" id="panel-file"></div></div>
  <div class="field"><div class="field-label">Risk</div><div class="field-value" id="panel-risk"></div></div>
  <div class="connections" id="panel-connections"></div>
</div>

<div id="legend">
  <div class="item"><div class="dot high"></div> High connectivity</div>
  <div class="item"><div class="dot med"></div> Medium connectivity</div>
  <div class="item"><div class="dot low"></div> Low connectivity</div>
  <div class="item note">Node size = caller count</div>
</div>

<div id="controls">
  Scroll to zoom<br>Drag to rotate<br>Click to inspect<br>Shift+Click to focus
</div>

<div id="graph"></div>

<script src="https://unpkg.com/3d-force-graph@1"></script>
<script>
const palette = [
  '#7c8aff', '#f78166', '#7ee787', '#d2a8ff', '#79c0ff',
  '#ffa657', '#ff7b72', '#a5d6ff', '#56d364', '#e6edf3',
  '#ff9ecb', '#b4f0a8', '#ffd700', '#87ceeb', '#dda0dd'
];

let data = { nodes: [], links: [] };
let adjacency = {};
let highlightNodes = new Set();
let highlightLinks = new Set();
let selectedNode = null;
let Graph = null;

const nodeColor = n => palette[(n.group || 0) % palette.length];

async function loadGraph() {
  try {
    const [nodesResp, edgesResp] = await Promise.all([
      fetch('/api/nodes'),
      fetch('/api/edges')
    ]);
    const nodes = await nodesResp.json();
    const edges = await edgesResp.json();

    const nodeIds = new Set(nodes.map(n => n.fqn));

    // Count callers for each node
    const callerCount = {};
    edges.forEach(e => {
      if (nodeIds.has(e.target_fqn)) {
        callerCount[e.target_fqn] = (callerCount[e.target_fqn] || 0) + 1;
      }
    });

    data = {
      nodes: nodes.map((n, i) => ({
        id: n.fqn,
        file: n.file,
        kind: n.kind,
        callers: callerCount[n.fqn] || 0,
        group: i % palette.length
      })),
      links: edges
        .filter(e => nodeIds.has(e.source_fqn) && nodeIds.has(e.target_fqn))
        .map(e => ({ source: e.source_fqn, target: e.target_fqn }))
    };

    // Build adjacency
    adjacency = {};
    data.links.forEach(l => {
      const src = typeof l.source === 'object' ? l.source.id : l.source;
      const tgt = typeof l.target === 'object' ? l.target.id : l.target;
      if (!adjacency[src]) adjacency[src] = { out: [], in: [] };
      if (!adjacency[tgt]) adjacency[tgt] = { out: [], in: [] };
      adjacency[src].out.push(tgt);
      adjacency[tgt].in.push(src);
    });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('stats-text').textContent = data.nodes.length + ' nodes, ' + data.links.length + ' edges';

    Graph = ForceGraph3D()(document.getElementById('graph'))
      .graphData(data)
      .backgroundColor('#0f0f14')
      .nodeColor(n => {
        if (highlightNodes.size > 0) {
          return highlightNodes.has(n.id) ? nodeColor(n) : 'rgba(60,60,80,0.3)';
        }
        return nodeColor(n);
      })
      .nodeVal(n => Math.max(2, Math.pow((n.callers || 0) + 1, 0.6) * 2))
      .nodeOpacity(0.92)
      .linkColor(link => {
        if (highlightLinks.size > 0) {
          return highlightLinks.has(link) ? 'rgba(168,177,255,0.7)' : 'rgba(40,40,60,0.06)';
        }
        return 'rgba(100,110,140,0.2)';
      })
      .linkWidth(link => highlightLinks.has(link) ? 2 : 0.8)
      .linkDirectionalParticles(link => highlightLinks.has(link) ? 2 : 0)
      .linkDirectionalParticleWidth(1.5)
      .linkDirectionalParticleColor(() => '#a8b1ff')
      .onNodeClick((node) => {
        selectedNode = node;
        showPanel(node);
        highlightConnections(node);
        Graph.nodeColor(Graph.nodeColor());
        Graph.linkColor(Graph.linkColor());
        Graph.linkWidth(Graph.linkWidth());
      })
      .onBackgroundClick(() => {
        selectedNode = null;
        highlightNodes.clear();
        highlightLinks.clear();
        document.getElementById('panel').classList.remove('visible');
        Graph.nodeColor(Graph.nodeColor());
        Graph.linkColor(Graph.linkColor());
        Graph.linkWidth(Graph.linkWidth());
      });

  } catch (err) {
    document.getElementById('loading').textContent = 'Failed to load graph';
    console.error(err);
  }
}

function highlightConnections(node) {
  highlightNodes.clear();
  highlightLinks.clear();
  highlightNodes.add(node.id);
  const adj = adjacency[node.id];
  if (adj) {
    adj.in.forEach(id => highlightNodes.add(id));
    adj.out.forEach(id => highlightNodes.add(id));
  }
  data.links.forEach(link => {
    const src = typeof link.source === 'object' ? link.source.id : link.source;
    const tgt = typeof link.target === 'object' ? link.target.id : link.target;
    if (src === node.id || tgt === node.id) highlightLinks.add(link);
  });
}

function showPanel(node, keepExpanded) {
  if (!keepExpanded) { window._expandedIn = false; window._expandedOut = false; }
  const panel = document.getElementById('panel');
  panel.classList.add('visible');
  document.getElementById('panel-name').textContent = node.id.split('::').pop() || node.id;
  document.getElementById('panel-kind').innerHTML = '<span class="badge badge-' + (node.kind || 'function').toLowerCase() + '">' + (node.kind || 'Function') + '</span>';
  document.getElementById('panel-file').textContent = node.file || 'unknown';

  const callers = node.callers || 0;
  const adj = adjacency[node.id] || { in: [], out: [] };
  let riskLevel, riskColor;
  if (callers >= 10) { riskLevel = 'High'; riskColor = '#f78166'; }
  else if (callers >= 4) { riskLevel = 'Medium'; riskColor = '#ffa657'; }
  else { riskLevel = 'Low'; riskColor = '#7ee787'; }
  document.getElementById('panel-risk').innerHTML = '<span style="color:' + riskColor + '">' + riskLevel + ' blast radius</span> (' + callers + ' callers, ' + adj.out.length + ' deps)';

  const connDiv = document.getElementById('panel-connections');
  let html = '';
  if (adj.in.length > 0) {
    html += '<div class="field-label" style="margin-bottom:6px">Called by (' + adj.in.length + ')</div>';
    const showAll = adj.in.length <= 12 || window._expandedIn;
    const slice = showAll ? adj.in : adj.in.slice(0, 8);
    slice.forEach(id => { html += '<div class="conn-item" onclick="focusNode(\'' + id.replace(/'/g, "\\'") + '\')">' + id.split('::').pop() + '</div>'; });
    if (!showAll) html += '<div class="conn-item" style="color:#a8b1ff" onclick="window._expandedIn=true;showPanel(selectedNode,true)">show ' + (adj.in.length - 8) + ' more</div>';
  }
  if (adj.out.length > 0) {
    html += '<div class="field-label" style="margin-top:12px;margin-bottom:6px">Calls (' + adj.out.length + ')</div>';
    const showAll = adj.out.length <= 12 || window._expandedOut;
    const slice = showAll ? adj.out : adj.out.slice(0, 8);
    slice.forEach(id => { html += '<div class="conn-item" onclick="focusNode(\'' + id.replace(/'/g, "\\'") + '\')">' + id.split('::').pop() + '</div>'; });
    if (!showAll) html += '<div class="conn-item" style="color:#a8b1ff" onclick="window._expandedOut=true;showPanel(selectedNode,true)">show ' + (adj.out.length - 8) + ' more</div>';
  }
  if (adj.in.length === 0 && adj.out.length === 0) html = '<div style="color:#4b5563;font-size:12px">No connections</div>';
  connDiv.innerHTML = html;
  lucide.createIcons();
}

function focusNode(id) {
  const node = data.nodes.find(n => n.id === id);
  if (node) {
    Graph.cameraPosition({ x: node.x + 100, y: node.y + 50, z: node.z + 100 }, { x: node.x, y: node.y, z: node.z }, 1000);
    setTimeout(() => { selectedNode = node; showPanel(node); highlightConnections(node); Graph.nodeColor(Graph.nodeColor()); Graph.linkColor(Graph.linkColor()); }, 500);
  }
}

function showTopNodes() {
  const sorted = [...data.nodes].sort((a, b) => (b.callers || 0) - (a.callers || 0));
  const top = sorted.slice(0, 5);
  highlightNodes.clear();
  top.forEach(n => highlightNodes.add(n.id));
  Graph.nodeColor(Graph.nodeColor());
  if (top[0]) focusNode(top[0].id);
}

// Search
document.getElementById('search').addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase();
  if (query.length < 2) { highlightNodes.clear(); highlightLinks.clear(); Graph.nodeColor(Graph.nodeColor()); return; }
  highlightNodes.clear();
  data.nodes.forEach(n => { if (n.id.toLowerCase().includes(query)) highlightNodes.add(n.id); });
  Graph.nodeColor(Graph.nodeColor());
});
document.getElementById('search').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && highlightNodes.size > 0) focusNode([...highlightNodes][0]);
});
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== document.getElementById('search')) { e.preventDefault(); document.getElementById('search').focus(); }
  if (e.key === 'Escape') { document.getElementById('search').blur(); document.getElementById('panel').classList.remove('visible'); }
});

lucide.createIcons();
loadGraph();
</script>
</body>
</html>
