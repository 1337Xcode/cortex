[workspace]
resolver = "3"
members = [
    "crates/cortex-cli",
    "crates/cortex-core",
    "crates/cortex-index",
    "crates/cortex-store",
    "tests",
    "xtask",
]

[workspace.package]
version = "2.0.0-dev"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/1337Xcode/cortex"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.21"
ignore = "0.4.34"
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# Default features off: they add a WebAssembly build of SQLite for wasm32 targets, which Cortex
# does not build for.
rusqlite = { version = "0.41.1", default-features = false, features = ["backup", "bundled", "cache"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing", "printing", "visit"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
tree-sitter = "0.27.1"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
