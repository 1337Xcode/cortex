[workspace]
resolver = "3"
members = [
    "crates/cortex-cli",
    "crates/cortex-core",
    "crates/cortex-coord",
    "crates/cortex-daemon",
    "crates/cortex-git",
    "crates/cortex-hook",
    "crates/cortex-index",
    "crates/cortex-learn",
    "crates/cortex-mcp",
    "crates/cortex-meter",
    "crates/cortex-retrieve",
    "crates/cortex-store",
    "eval",
    "tests",
    "xtask",
]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/1337Xcode/cortex"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
# Default features off: the map server needs HTTP/1 on tokio only.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
# Windows only: a process started with handle inheritance off, which std cannot do on stable
# Rust. Pinned to the version read in full: its `current_dir` frees the folder name before the
# call, so Cortex never calls it.
CreateProcessW = "=0.1.8"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# Default features off: they bring networking, credentials, worktree changes and more that Cortex
# does not use. `blob-diff` finds renamed files by their contents; `sha1` is the object id hash.
gix = { version = "0.90.0", default-features = false, features = ["blob-diff", "sha1"] }
# The operating system's random number generator, for the map's access token.
getrandom = "0.4.3"
globset = "0.4.21"
ignore = "0.4.34"
interprocess = "2.4.7"
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
# Tests only: the exact personalized PageRank that local push is checked against.
petgraph = { version = "0.8.3", default-features = false, features = ["std"] }
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# Exactly the version the `scip` crate pins and was generated with; Cortex needs its `Message`
# trait to read an index.
protobuf = "=3.7.2"
regex = "1.13.1"
rmcp = { version = "3.9.0", default-features = false, features = ["macros", "server", "transport-io"] }
# Default features off: they add a WebAssembly build of SQLite for wasm32 targets, which Cortex
# does not build for.
rusqlite = { version = "0.41.1", default-features = false, features = ["backup", "bundled", "cache"] }
scip = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
# `float_roundtrip`: numbers read back exactly as they were written (the default parser may land
# one unit in the last place off), so a stored model or set of features is the one that was kept.
serde_json = { version = "1.0.154", features = ["float_roundtrip", "raw_value"] }
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing", "printing", "visit"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
tokio = "1.54.1"
# Default features off: `attributes` adds the `#[instrument]` macro, which Cortex does not use.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# Only the registry the daemon's own log layer sits on: no formatting, colours or filters by
# environment.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-md = "0.5.4"
tree-sitter-php = "0.25.1"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-scala = "0.26.3"
tree-sitter-sequel = "0.3.11"
tree-sitter-swift = "0.7.4"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
# Without its default features: they bring a random number generator Cortex does not use.
ulid = { version = "3.0.0", default-features = false }
widestring = "1.0.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Debug builds keep line tables only, and their dependencies no debug information: backtraces keep
# their files and lines, while the binaries and test executables come to under half their size,
# and the build takes less time and disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
