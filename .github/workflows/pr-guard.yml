# Labels pull requests from brand-new accounts, pull requests opened within a day of their fork,
# and pull requests whose Verification section is empty, and leaves one comment saying what a
# maintainer will look for. It never closes a pull request, never requests changes and never runs
# the pull request's code: it reads facts through the API and runs the rule in
# .github/scripts/pr-guard.mjs as it is on the default branch, so a pull request cannot change the
# rule that judges it. A maintainer overrides it with the `maintainer-ok` label or .github/VOUCHED.
name: Pull request guard

on:
  # Runs in the base repository's context so it can label pull requests from forks. Safe because no
  # step checks out, builds or runs anything from the pull request.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, edited, synchronize, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Number of the pull request to judge
        required: true
        type: number
      dry_run:
        description: Print the decision without labelling or commenting
        required: true
        type: boolean
        default: true

permissions: {}

concurrency:
  # A dry run never cancels a real run of the same pull request, nor the other way round.
  group: pr-guard-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # the rule and the vouch list, from the default branch
      pull-requests: write # labels and the one comment; a pull request's own permission covers both
    steps:
      # The default branch only, and only the rule and the vouch list from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/pr-guard.mjs
            .github/VOUCHED
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PULL_REQUEST: ${{ github.event.pull_request.number || inputs.pull_request }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        with:
          script: |
            const { readFile } = await import("node:fs/promises");
            const { join } = await import("node:path");
            const { pathToFileURL } = await import("node:url");
            const workspace = process.env.GITHUB_WORKSPACE;
            const guard = await import(pathToFileURL(join(workspace, ".github/scripts/pr-guard.mjs")).href);
            const vouched = guard.parseVouched(await readFile(join(workspace, ".github/VOUCHED"), "utf8"));
            const dryRun = process.env.DRY_RUN === "true";
            const { login, decision } = await guard.run({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: Number(process.env.PULL_REQUEST),
              vouched,
              dryRun,
            });
            core.info(`pull request #${process.env.PULL_REQUEST} by ${login}: ${JSON.stringify(decision)}`);
            if (dryRun) {
              core.info("dry run: nothing changed");
            }
