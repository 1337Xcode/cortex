# CodeQL's security queries over the Rust code and over these workflows, on every push to main,
# every pull request and once a week (new queries arrive with CodeQL releases). Free for public
# repositories; findings appear under the repository's Security tab.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # uploading the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The code that ships. Tests and fixtures never run on a user's machine, and their names
          # set off false alarms (an assertion printing the score of a file named billing.py read
          # as logging billing data).
          config: |
            paths-ignore:
              - "tests/**"
              - "crates/*/tests/**"
              - "crates/*/benches/**"
              - "eval/results/**"
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
