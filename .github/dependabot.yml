# Keeps the pinned action commits and the Cargo dependencies current. Each week at most one pull
# request per ecosystem, every update grouped into it, so the review is one diff a week, and every
# such pull request runs the same CI as any other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz
    schedule:
      interval: weekly
      day: monday
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
