[package]
name = "cortex-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
cortex-core = { path = "../crates/cortex-core" }
cortex-hook = { path = "../crates/cortex-hook" }
cortex-index = { path = "../crates/cortex-index" }
cortex-meter = { path = "../crates/cortex-meter" }
libfuzzer-sys = "0.4.13"

[[bin]]
name = "hook_stdin"
path = "fuzz_targets/hook_stdin.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame_decode"
path = "fuzz_targets/frame_decode.rs"
test = false
doc = false

[[bin]]
name = "extract_source"
path = "fuzz_targets/extract_source.rs"
test = false
doc = false

[[bin]]
name = "transcript_line"
path = "fuzz_targets/transcript_line.rs"
test = false
doc = false
bench = false

# A workspace of its own: the targets build on nightly with the fuzzer's instrumentation, apart
# from the repository's workspace.
[workspace]
members = ["."]
